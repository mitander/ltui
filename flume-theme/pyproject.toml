[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flume-tracker-theme"
version = "0.1.0"
description = "Personal Flume palette adapter for this Pantheon fork"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["textual>=1.0", "watchfiles>=1.0"]

[tool.setuptools]
py-modules = ["flume_tracker_theme"]
